# tmux bindings for the agent sessions: file transfer with trzsz (trz / tsz).
#
# Mounted into the container as /etc/tmux.conf. tmux reads it once, when its server
# starts, so a change needs `tmux source-file /etc/tmux.conf` or a server with no
# sessions left.
#
# Both bindings open a popup over the agent instead of a new window: the agent keeps
# running underneath, and trz / tsz get a terminal of their own. That matters — trzsz in
# tmux writes its handshake straight to the client's tty and expects the answer on the
# keyboard of the pane it runs in, and an agent's prompt must never receive that answer.
#
# It only works when the client side understands trzsz: `cx` with CX_TRANSPORT=tssh
# (tssh --udp), or `trzsz ssh`. Over mosh or plain ssh the handshake goes nowhere and
# trz gives up on its own after a few seconds.

# prefix + U: pick files on the client, they land in a fresh directory under
# /exchange/upload, and their paths are typed into the agent's prompt without Enter.
# On a failure the popup stays open so the message can be read.
bind-key U display-popup -E -w 80% -h 40% -T " upload: pick files on the client " \
	"lab up || { echo; printf 'press Enter to close '; read -r _; }"

# prefix + D: a shell in the directory of the current pane; `tsz <file>` downloads to the
# client machine, `exit` closes the popup.
bind-key D display-popup -E -w 80% -h 60% -d "#{pane_current_path}" \
	-T " download: tsz <file>, then exit "
